name: Build and Deploy

on:
  push:
    tags:
      - '*'
    # Branch pushes only run the build when a commit message contains
    # "run-ci" (checked in the build job's `if`); release still needs a tag.
    branches:
      - '**'
  # Manual run for validation only (no release: the release job below
  # requires a v* tag ref). Use the `note` input as a log marker.
  workflow_dispatch:
    inputs:
      note:
        description: 'Marker note shown in the log (e.g. os2-fix-try1)'
        required: false
        default: 'manual-validation'

jobs:
  build:
    # Runs on: tag pushes (release path), manual dispatch (validation),
    # or branch pushes whose HEAD commit message contains "run-ci".
    # The `|| ''` guards events without head_commit (tags, dispatch).
    if: >
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message || '', 'run-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          npm install -g ttf2woff2
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge
          pip install bdflib fonttools

      - name: Build fonts
        run: bash tools/build.sh

      - name: Validate OS/2 with fontTools
        run: |
          echo "=== ZPIX validation marker: ${{ inputs.note }} ==="
          ZPIX_TTF=dist/zpix.ttf python3 __tests__/test_os2_table_regression.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zpix-font
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get Version
        run: |
          VERSION=$(node ./.github/workflows/ci-get-pkg-version.cjs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get Changelog
        run: |
          node ./.github/workflows/ci-get-changelog.cjs --tag=${{ env.VERSION }} > CHANGELOG-${{ env.VERSION }}.md

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: zpix-font
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG-${{ env.VERSION }}.md
          files: |
            dist/zpix.bdf
            dist/zpix.ttf
            dist/zpix.woff2
